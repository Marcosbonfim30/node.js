<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro – Clínica</title>
</head>
<body>
  <h2>Novo cadastro</h2>
  <form method="POST" action="/register">
    <label>Nome:</label>
    <input type="text" name="nome" required><br><br>
    <label>RG:</label>
    <input type="text" name="rg" required><br><br>
    <label>Senha:</label>
    <input type="password" name="senha" required><br><br>
    <button type="submit">Salvar</button>
  </form>
  <p><a href="/">Voltar ao login</a></p>
</body>
</html>
