<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login – Clínica</title>
</head>
<body>
  <h2>Login</h2>
  <form method="POST" action="/login">
    <label>RG:</label>
    <input type="text" name="rg" required><br><br>
    <label>Senha:</label>
    <input type="password" name="senha" required><br><br>
    <button type="submit">Entrar</button>
  </form>
  <p>Não tem conta? <a href="/register">Criar agora</a></p>
</body>
</html>
